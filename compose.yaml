services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: trello_dev
      POSTGRES_DB: trello
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: